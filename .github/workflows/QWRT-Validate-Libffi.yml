name: QWRT isolated libffi validation
'on':
  push:
    branches:
    - wabi/validate-libffi-20261025
permissions:
  contents: read
env:
  WRT_CONFIG: IPQ60XX-WIFI-YES
  WRT_THEME: argon
  WRT_NAME: QWRT
  WRT_SSID: QWRT
  WRT_WORD: '12345678'
  WRT_IP: 172.16.3.1
  WRT_PW: '12345678'
  WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
  WRT_BRANCH: main
  WRT_SOURCE: VIKINGYFY/immortalwrt
  WRT_PACKAGE: ''
  WRT_TEST: 'false'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout Projects
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        df -h
        sudo apt-get -yqq update
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential bzip2 ca-certificates ccache clang \
          cmake cpio curl device-tree-compiler dos2unix file flex \
          g++-multilib gawk gcc-multilib genisoimage gettext git jq \
          libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
          llvm ninja-build patch perl pkgconf python3 python3-cryptography \
          python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
          unzip wget xz-utils zlib1g-dev zstd

        sudo timedatectl set-timezone "Asia/Shanghai"

        sudo mkdir -p /mnt/build_wrt
        sudo chown $USER:$USER /mnt/build_wrt
        sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

        free_kib=$(df -Pk /mnt/build_wrt | awk "END {print \$4}")
        (( free_kib >= 41943040 )) || { echo "Insufficient runner disk for full firmware verification"; exit 73; }
    - name: Initialization Values
      id: initialize-values
      run: |
        WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
        WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
        WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
        WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
        WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
        WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
        WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

        {
          echo "WRT_INFO=${WRT_SOURCE%%/*}"
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
          echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
          echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
          echo "WRT_SUBTARGET=$WRT_SUBTARGET"
          echo "WRT_TARGET=$WRT_TARGET"
          echo "WRT_WIFI=$WRT_WIFI"
          echo "WRT_KVER=none"
          echo "WRT_LIST=none"
        } >> "$GITHUB_ENV"
        echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
    - name: Clone Code
      id: clone-code
      run: |
        git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

        cd ./wrt/
        git fetch --depth=1 origin f9b0ce7650fdcc7f4793256a3ae43c1132e2bc49
        git checkout --detach FETCH_HEAD
        WRT_HASH=$(git rev-parse HEAD)
        echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
        echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
        echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

        # GitHub Action 移除国内下载源
        PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
        if [ -f "$PROJECT_MIRRORS_FILE" ]; then
          sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
        fi

        sed -i 's|^src-git packages .*|src-git packages https://github.com/immortalwrt/packages.git^72c7391fb2d04080afd0bfe919605749f81eb747|' feeds.conf.default
    - name: Check Scripts
      run: |
        find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
    - name: Update Feeds
      run: |
        cd ./wrt/

        ./scripts/feeds update -a
        ./scripts/feeds install -a
    - name: Custom Packages
      run: |
        cd ./wrt/

        $GITHUB_WORKSPACE/Scripts/Packages.sh
        $GITHUB_WORKSPACE/Scripts/Handles.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Custom Settings
      run: |
        cd ./wrt/

        if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
        else
          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
        fi

        $GITHUB_WORKSPACE/Scripts/Settings.sh

        make defconfig -j$(nproc) && make clean -j$(nproc)

        mkdir -p "$GITHUB_WORKSPACE/validation-logs"
        cp .config "$GITHUB_WORKSPACE/validation-logs/final.config"
        python3 - <<'CHECK'
        from pathlib import Path
        s=Path(".config").read_text().splitlines()
        d=[x for x in s if x.startswith("CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_") and x.endswith("=y")]
        assert d==["CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y"], d
        assert Path("package/libs/libffi/Makefile").is_file()
        CHECK
    - name: Download Packages
      run: |
        set -euo pipefail
        mkdir -p validation-logs
        cd wrt
        make download -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/validation-logs/download.log"
    - name: Regression checks
      run: bash tests/test-libffi-fallback.sh
    - name: Record exact sources
      run: |
        mkdir -p validation-logs
        find wrt -type d -name .git -print0 | while IFS= read -r -d "" d; do r=${d%/.git}; printf "%s %s\n" "$r" "$(git -C "$r" rev-parse HEAD)"; done | tee validation-logs/git-sources.txt
    - name: Full firmware compile only
      working-directory: wrt
      run: |
        set -euo pipefail
        make -j$(nproc) V=s 2>&1 | tee "$GITHUB_WORKSPACE/validation-logs/full-build.log" || make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/validation-logs/full-build-retry.log"
        find bin/targets/qualcommax/ipq60xx -type f -name "*jdcloud_re-cs-02*sysupgrade*" | grep .
        find bin/targets/qualcommax/ipq60xx -type f -print0 | sort -z | xargs -0 -r sha256sum | tee "$GITHUB_WORKSPACE/validation-logs/output-sha256.txt"
        echo FULL_FIRMWARE_BUILD_PASS | tee "$GITHUB_WORKSPACE/validation-logs/result.txt"
    - name: Machine Information
      run: |
        cd ./wrt/

        echo "======================="
        lscpu | grep -E "name|Core|Thread"
        echo "======================="
        df -h
        echo "======================="
        du -h --max-depth=1
        echo "======================="
    - name: Save verification artifacts, not Release
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: qwrt-libffi-isolated-validation
        path: |-
          validation-logs/**/*
          wrt/bin/targets/**/*
          wrt/logs/**/*
        if-no-files-found: warn
        retention-days: 3
concurrency:
  group: qwrt-isolated-libffi-20261025
  cancel-in-progress: false
